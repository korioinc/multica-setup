[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multica-setup"
dynamic = ["version"]
description = "Declarative workspace resource synchronization for Multica"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
multica-setup = "multica_setup.cli:main"

[tool.setuptools.dynamic]
version = { attr = "multica_setup.__version__" }

[tool.setuptools.packages.find]
include = ["multica_setup*"]
